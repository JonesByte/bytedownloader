  <script>
    const I18N = {
      'pt': {
        title1: 'BAIXA. ',
        title2: 'MELHORA. ',
        title3: 'CONVERTE.',
        subtitle: 'Cole o link, pegue o vídeo, melhore imagem com IA, transcreva fala e deixe tudo pronto no mesmo app.',
        status: 'Redirecionando para o site oficial...',
        button: 'Acessar agora',
        targetLang: ''
      },
      'pt-pt': {
        title1: 'TRANSFERE. ',
        title2: 'MELHORA. ',
        title3: 'CONVERTE.',
        subtitle: 'Cola a ligação, obtém o vídeo, guarda a capa, melhora a imagem, transcreve a voz e prepara o áudio.',
        status: 'A redirecionar para o site oficial...',
        button: 'Aceder agora',
        targetLang: 'pt-pt'
      },
      'en': {
        title1: 'DOWNLOAD. ',
        title2: 'ENHANCE. ',
        title3: 'CONVERT.',
        subtitle: 'Paste the link, grab videos, upscale images with AI, transcribe speech, and prepare your audio in one app.',
        status: 'Redirecting to official website...',
        button: 'Enter now',
        targetLang: 'en'
      },
      'es': {
        title1: 'DESCARGA. ',
        title2: 'MEJORA. ',
        title3: 'CONVIERTE.',
        subtitle: 'Pega el enlace, baja el video, mejora imágenes con IA, transcribe voz y prepara el audio en la misma app.',
        status: 'Redirigiendo al sitio oficial...',
        button: 'Entrar ahora',
        targetLang: 'es'
      }
    };

    function detectLang() {
      const pathname = window.location.pathname.toLowerCase();
      if (pathname.includes('/pt-pt')) return 'pt-pt';
      if (pathname.includes('/pt')) return 'pt';
      if (pathname.includes('/es')) return 'es';
      if (pathname.includes('/en') || pathname.includes('/us')) return 'en';

      const navLangs = navigator.languages || [navigator.language || 'pt'];
      for (const lang of navLangs) {
        const l = lang.toLowerCase();
        if (l === 'pt-pt') return 'pt-pt';
        if (l.startsWith('pt')) return 'pt';
        if (l.startsWith('es')) return 'es';
        if (l.startsWith('en')) return 'en';
      }
      return 'pt';
    }

    const currentLangKey = detectLang();
    const t = I18N[currentLangKey] || I18N['pt'];

    function getTargetUrl() {
      const subPath = t.targetLang ? t.targetLang : '';
      const search = window.location.search || '';
      const hash = window.location.hash || '';
      return 'https://jonesbyte.github.io/bd/' + (subPath ? subPath + '/' : '') + search + hash;
    }

    const targetUrl = getTargetUrl();

    // Redirecionamento suave após breve instante para exibir a logo oficial
    setTimeout(function() {
      window.location.replace(targetUrl);
    }, 450);
  </script>

    btn.textContent = t.button;

  </script>
